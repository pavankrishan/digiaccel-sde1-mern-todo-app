# Render Blueprint for the backend API (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: todo-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # set in the Render dashboard (MongoDB Atlas connection string)
      - key: CORS_ORIGIN
        sync: false   # e.g. https://your-app.netlify.app
